<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PC Doctor AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 850px;
      margin: 0 auto;
      padding: 60px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aab3c5;
      font-size: 18px;
    }

    .status {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 14px;
      border-radius: 20px;
      background: #14251b;
      color: #55e391;
      font-size: 14px;
    }

    .card {
      background: #121a2e;
      border: 1px solid #26324d;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #34415f;
      background: #0b1020;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6c8cff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #5b7cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .answer {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #0b1020;
      border: 1px solid #26324d;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .error {
      color: #ff7777;
    }

    .footer {
      text-align: center;
      color: #69748c;
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">🩺 PC Doctor AI</div>

      <div class="subtitle">
        AI-powered PC troubleshooting
      </div>

      <div class="status">
        ● AI System Online
      </div>
    </div>

    <div class="card">

      <textarea
        id="question"
        placeholder="Describe your PC problem...

Example:
My PC turns on but the screen stays black."
      ></textarea>

      <button id="askButton" onclick="askPCDoctor()">
        Diagnose My PC
      </button>

      <div id="answer" class="answer"></div>

    </div>

    <div class="footer">
      PC Doctor AI • Always use caution when working with computer hardware.
    </div>

  </div>

  <script>

    const WORKER_URL =
      "https://old-night-a4f6pc-doctor-ai.daviddawpoweryt.workers.dev/";

    async function askPCDoctor() {

      const questionBox = document.getElementById("question");
      const answerBox = document.getElementById("answer");
      const button = document.getElementById("askButton");

      const question = questionBox.value.trim();

      if (!question) {
        answerBox.style.display = "block";
        answerBox.className = "answer error";
        answerBox.textContent = "Please describe your PC problem first.";
        return;
      }

      button.disabled = true;
      button.textContent = "PC Doctor AI is thinking...";

      answerBox.style.display = "block";
      answerBox.className = "answer";
      answerBox.textContent = "Diagnosing your PC problem...";

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "The AI server returned an error."
          );
        }

        answerBox.textContent =
          data.answer || "PC Doctor AI did not return an answer.";

      } catch (error) {

        answerBox.className = "answer error";

        answerBox.textContent =
          "Sorry, something went wrong connecting to PC Doctor AI.\n\n" +
          error.message;

      } finally {

        button.disabled = false;
        button.textContent = "Diagnose My PC";

      }
    }

  </script>

</body>
</html>
